name: Auto-Post Scheduled Affiliate Deals

on:
  schedule:
    # Runs every 30 minutes (UTC) on GitHub Actions Free Tier ($0 cost)
    - cron: '*/30 * * * *'
  workflow_dispatch:
    # Allows manual trigger anytime from GitHub Actions tab

jobs:
  dispatch-deals:
    name: Dispatch Due Scheduled Deals
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger Auto-Publish Webhook
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "Error: Secret APP_URL is not set in GitHub repository settings!"
            echo "Please add APP_URL (e.g., https://your-project.vercel.app) to Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          # Strip trailing slash if present
          CLEAN_URL="${APP_URL%/}"
          WEBHOOK_URL="${CLEAN_URL}/api/cron/publish"

          echo "Pinging Auto-Publish endpoint: $WEBHOOK_URL at $(date -u)"

          # Send authenticated POST request with CRON_SECRET bearer token
          HTTP_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST "$WEBHOOK_URL" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --connect-timeout 15 \
            --max-time 60)

          # Extract body and status
          BODY=$(echo "$HTTP_RESPONSE" | sed -e '$d')
          STATUS=$(echo "$HTTP_RESPONSE" | tail -n1 | sed -e 's/HTTP_STATUS://')

          echo "Response Status: $STATUS"
          echo "Response Body:"
          echo "$BODY"

          # Check if request was successful
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "✓ Scheduled deals check completed successfully!"
          else
            echo "✗ Failed to trigger auto-publish endpoint (HTTP $STATUS)"
            exit 1
          fi
